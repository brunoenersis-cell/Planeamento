services:
  - type: web
    name: cronograma-safetyculture
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: SAFETYCULTURE_API_TOKEN
        sync: false
      - key: SAFETYCULTURE_API_BASE_URL
        value: https://api.safetyculture.io
      - key: APP_ACCESS_PASSWORD
        sync: false
